# k6 (https://grafana.com/docs/k6/latest/) running scripts/orders.js in the cluster.
# `make load-stop` / `make load-start` scale the Deployment to 0 / 1 replicas.
replicas: 1

image:
  repository: docker.io/grafana/k6
  tag: 2.3.0
  pullPolicy: IfNotPresent

# Same URLs as from the host: the CoreDNS rewrite sends *.localtest.me to the edge Gateway.
baseUrl: https://api.localtest.me
# Client credentials of the test client "loadgen" (customers realm); the Secret is created by
# deploy/scripts/identity-secrets.sh.
tokenUrl: https://sso.localtest.me/realms/customers/protocol/openid-connect/token
clientSecret: loadgen-client
# CA of https://*.localtest.me (deploy/scripts/mkcert-ca.sh); Go (k6) reads SSL_CERT_FILE.
caConfigMap: localtest-ca
# Iterations per second; each makes 2-3 requests at the edge (POST order, GET order, sometimes
# GET user), i.e. about 4-5 requests per second at the gateway.
rate: 2
# One long run instead of daily restarts that would look like crash loops.
duration: 8760h

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
