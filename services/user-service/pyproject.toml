[project]
name = "user-service"
version = "0.1.0"
description = "Demo user service (FastAPI, OpenTelemetry-instrumented)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "shd-telemetry",
]

[project.scripts]
user-service = "user_service.__main__:main"

[tool.uv.sources]
shd-telemetry = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/user_service"]
