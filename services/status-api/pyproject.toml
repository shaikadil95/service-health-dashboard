[project]
name = "status-api"
version = "0.1.0"
description = "Status API (backend for frontend): UP / DEGRADED / DOWN per service from Prometheus and Alertmanager."
requires-python = ">=3.12,<3.13"
dependencies = [
    "shd-telemetry",
    "httpx>=0.28",
]

[project.scripts]
status-api = "status_api.__main__:main"

[tool.uv.sources]
shd-telemetry = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/status_api"]
