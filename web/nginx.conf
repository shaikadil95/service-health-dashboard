# Static single-page app. /api is not proxied here: the gateway routes /api on the same host to
# the Status API, so the browser never needs CORS.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    # Probes: nginx answers, nothing else to check.
    location = /livez { access_log off; default_type application/json; return 200 '{"status":"alive"}'; }
    location = /readyz { access_log off; default_type application/json; return 200 '{"status":"ready"}'; }

    # Content-hashed files never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback; index.html must be revalidated so a new deployment is picked up.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
