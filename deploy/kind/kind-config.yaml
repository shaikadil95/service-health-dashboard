# Single-node kind cluster for the local platform. Created by `make cluster-up`.
# Reference: https://kind.sigs.k8s.io/docs/user/configuration/
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: shd
nodes:
  - role: control-plane
    # Pre-built image for kind v0.33.0, pinned by digest as the release notes require:
    # https://github.com/kubernetes-sigs/kind/releases/tag/v0.33.0
    # v1.36 rather than kind's default v1.37: Envoy Gateway v1.9 is tested on Kubernetes 1.33-1.36
    # (https://gateway.envoyproxy.io/news/releases/matrix/). kubectl must be 1.35-1.37 (version skew).
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    # Host ports 80/443 -> Envoy proxy NodePorts (see deploy/charts/edge). Bound to 127.0.0.1 only,
    # so the gateway is not reachable from the LAN.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP
