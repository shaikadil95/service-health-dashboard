{{- if or .Values.oidc .Values.jwt }}
# Envoy's own connection to Keycloak (token endpoint, JWKS): the public hostname, so the issuer and
# the TLS certificate match, verified with the local CA instead of Envoy's system trust bundle.
# https://gateway.envoyproxy.io/docs/tasks/security/oidc/#connect-to-an-oidc-provider-with-self-signed-certificate
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: keycloak
spec:
  endpoints:
    - fqdn:
        hostname: {{ .Values.idp.host }}
        port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: keycloak
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: keycloak
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: {{ .Values.idp.caConfigMap }}
    hostname: {{ .Values.idp.host }}
{{- end }}
