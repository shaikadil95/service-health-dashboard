{{- if .Values.dashboards.enabled }}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
# Grafana dashboard as code. The Grafana dashboard sidecar (kube-prometheus-stack) loads every
# ConfigMap labelled grafana_dashboard=1; the JSON is the source of truth (UI edits are not saved).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-{{ base $path | trimSuffix ".json" }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: service-health-dashboard
data:
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
---
{{- end }}
{{- end }}
