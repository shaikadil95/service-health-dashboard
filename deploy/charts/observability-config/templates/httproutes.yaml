{{- $gw := .Values.gateway.parentRef -}}
{{- range .Values.routes }}
{{- if .blockedPathPrefixes }}
# Envoy Gateway extension filter: answers 403 at the edge without calling the backend.
# https://gateway.envoyproxy.io/docs/tasks/traffic/direct-response/
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: {{ .name }}-deny
spec:
  directResponse:
    statusCode: 403
    contentType: text/plain
    body:
      type: Inline
      inline: "Forbidden: this endpoint is only reachable inside the cluster.\n"
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}
spec:
  parentRefs:
    - name: {{ $gw.name }}
      namespace: {{ $gw.namespace }}
      sectionName: {{ $gw.sectionName }}
  hostnames:
    - {{ .hostname | quote }}
  rules:
    {{- if .blockedPathPrefixes }}
    # Longer prefixes win over "/", so these paths never reach the backend.
    - matches:
        {{- range .blockedPathPrefixes }}
        - path:
            type: PathPrefix
            value: {{ . | quote }}
        {{- end }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: {{ .name }}-deny
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .service }}
          port: {{ .port }}
---
{{- end }}
