{{- if .Values.httpRoute.enabled }}
{{- if not (and .Values.httpRoute.hostnames .Values.httpRoute.pathPrefixes) }}
{{- fail "httpRoute.hostnames and httpRoute.pathPrefixes are required when httpRoute.enabled is true" }}
{{- end }}
# Only the listed path prefixes are exposed. Anything else on the hostname (for example /admin,
# /livez, /readyz or /docs) has no matching rule, so Envoy answers 404 without calling the service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "microservice.name" . }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    - matches:
        {{- range .Values.httpRoute.pathPrefixes }}
        - path:
            type: PathPrefix
            value: {{ . | quote }}
        {{- end }}
      backendRefs:
        - name: {{ include "microservice.name" . }}
          port: {{ .Values.service.port }}
    {{- range .Values.httpRoute.extraRules }}
    # {{ .pathPrefix }} -> {{ .service }} {{ .replacePrefix }} (same origin, longer prefix wins)
    - matches:
        - path:
            type: PathPrefix
            value: {{ .pathPrefix | quote }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: {{ .replacePrefix | quote }}
      backendRefs:
        - name: {{ .service }}
          port: {{ .port | default 80 }}
    {{- end }}
    {{- range .Values.httpRoute.redirects }}
    # {{ .pathPrefix }} -> 302 {{ .path }} (answered by the gateway, after its filters ran)
    - matches:
        - path:
            type: PathPrefix
            value: {{ .pathPrefix | quote }}
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: {{ .path | quote }}
            statusCode: 302
    {{- end }}
{{- end }}
