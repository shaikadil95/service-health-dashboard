# Keycloak Operator CRDs, official manifests pinned to a release tag
# (https://www.keycloak.org/operator/installation#_installing_by_using_kubectl_without_operator_lifecycle_manager).
# Applied with server-side apply by deploy/scripts/keycloak-operator.sh: two of them are ~0.5 MB,
# far above the 256 KiB limit of client-side apply's last-applied annotation.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/26.8.1/kubernetes/keycloaks.k8s.keycloak.org-v1.yml
  - https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/26.8.1/kubernetes/keycloakrealmimports.k8s.keycloak.org-v1.yml
  # Watched by the 26.8 operator even if unused here (it fails to start without them).
  - https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/26.8.1/kubernetes/keycloakoidcclients.k8s.keycloak.org-v1.yml
  - https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/26.8.1/kubernetes/keycloaksamlclients.k8s.keycloak.org-v1.yml
