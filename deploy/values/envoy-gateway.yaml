# Envoy Gateway controller (oci://docker.io/envoyproxy/gateway-helm). The chart also installs the
# Gateway API CRDs (experimental channel, v1.6.1 for EG v1.9) and the Envoy Gateway CRDs from its
# crds/ directory. Helm installs CRDs once and never upgrades them: after a chart upgrade, apply the
# new CRDs first (https://gateway.envoyproxy.io/docs/install/install-helm/#upgrading-from-the-previous-version).
deployment:
  envoyGateway:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

# Phase 6: the OIDC and JWT SecurityPolicies reach Keycloak through a `Backend` resource (FQDN
# sso.localtest.me:443) with a BackendTLSPolicy that trusts the mkcert CA, as in
# https://gateway.envoyproxy.io/docs/tasks/security/oidc/#connect-to-an-oidc-provider-with-self-signed-certificate
# The Backend API is an Envoy Gateway extension that must be switched on.
config:
  envoyGateway:
    extensionApis:
      enableBackend: true
