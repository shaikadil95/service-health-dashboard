# kube-prometheus-stack (prometheus-community): Prometheus Operator, Prometheus, Alertmanager, Grafana,
# kube-state-metrics and node-exporter. Values reference:
# https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
#
# Short, stable names: kps-prometheus, kps-alertmanager, kps-operator, grafana, kube-state-metrics.
fullnameOverride: kps

# The CRDs come from the prometheus-operator-crds release (installed first, server-side apply, and
# upgraded with the chart), not from this chart's crds/ directory, which Helm never upgrades.
crds:
  enabled: false

# Default alerting and recording rules. Rules for control-plane components that are not scraped on
# kind (see below) are switched off so that they do not alert on missing targets. The "general" group
# (Watchdog, InfoInhibitor, TargetDown) is replaced by the project's own rules in
# charts/alerting/rules (Watchdog, TelemetryPipelineDown); the other defaults stay and are routed to
# the team mailbox by severity (charts/alerting/alertmanager).
defaultRules:
  rules:
    general: false
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false

windowsMonitoring:
  enabled: false

# kind runs etcd, kube-controller-manager and kube-scheduler with their metrics bound to 127.0.0.1,
# and kube-proxy's metrics address is 127.0.0.1:10249 as well. Their targets would only ever be
# down, so they are not scraped rather than left red.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# --- Prometheus Operator -----------------------------------------------------------------------
prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 192Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 25Mi
      limits:
        memory: 64Mi

# --- Prometheus --------------------------------------------------------------------------------
prometheus:
  prometheusSpec:
    # Pick up every ServiceMonitor, PodMonitor, Probe, ScrapeConfig and PrometheusRule in the cluster,
    # not only the ones labelled with this release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    # OTLP push from the Collector: POST /api/v1/otlp/v1/metrics (--web.enable-otlp-receiver).
    # https://prometheus.io/docs/guides/opentelemetry/
    enableOTLPReceiver: true
    otlp:
      # Only low-cardinality resource attributes become labels. job (= service.name) and
      # instance (= service.instance.id) are always set; the rest stays on target_info.
      promoteResourceAttributes:
        - service.name
        - k8s.namespace.name
        - k8s.pod.name
      # Default; spelled out because dashboards and alerts depend on the resulting names, e.g.
      # http.server.request.duration -> http_server_request_duration_seconds_bucket.
      translationStrategy: UnderscoreEscapingWithSuffixes
    # Tempo's metrics-generator remote-writes service-graph and span metrics.
    enableRemoteWriteReceiver: true
    # Exemplars (trace IDs on histogram samples) for metric -> trace links in Grafana (Phase 4).
    enableFeatures:
      - exemplar-storage
    exemplars:
      maxSize: 100000
    tsdb:
      # Batching in the Collector and the metrics-generator can deliver samples late.
      outOfOrderTimeWindow: 30m

    retention: 24h
    retentionSize: 1.5GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi

    externalUrl: https://prometheus.localtest.me
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1536Mi

# --- Alertmanager ------------------------------------------------------------------------------
# Routes, receivers, inhibition rules and the email template come from the Secret alertmanager-shd,
# which the alerting release renders from charts/alerting/alertmanager (tested with amtool). The
# chart's own default configuration is not used.
alertmanager:
  alertmanagerSpec:
    useExistingSecret: true
    configSecret: alertmanager-shd
    externalUrl: https://alertmanager.localtest.me
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

# --- Grafana -----------------------------------------------------------------------------------
grafana:
  fullnameOverride: grafana
  # Two dashboards as code (charts/observability-config/dashboards, picked up by the dashboard
  # sidecar from ConfigMaps labelled grafana_dashboard=1). The ~25 default Kubernetes dashboards
  # of the chart are not installed.
  defaultDashboardsEnabled: false
  # No PVC: datasources and dashboards are provisioned from ConfigMaps, nothing to keep.
  persistence:
    enabled: false
  # Admin credentials from a Secret that `make deploy` generates once per cluster
  # (deploy/scripts/grafana-admin-secret.sh), never the chart default "prom-operator".
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    server:
      root_url: https://grafana.localtest.me
    auth.anonymous:
      enabled: false
    # Single sign-on with Keycloak's "ops" realm (Phase 6), Grafana's native OAuth:
    # https://grafana.com/docs/grafana/latest/setup-grafana/configure-access/configure-authentication/keycloak/
    # The login form stays for the break-glass admin (Secret grafana-admin).
    auth:
      signout_redirect_url: https://sso.localtest.me/realms/ops/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=https%3A%2F%2Fgrafana.localtest.me%2Flogin
    auth.generic_oauth:
      enabled: true
      name: Keycloak (ops)
      allow_sign_up: true
      client_id: grafana
      # client_secret: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET from the Secret grafana-oauth (envValueFrom)
      scopes: openid email profile
      use_pkce: true
      use_refresh_token: true
      email_attribute_path: email
      login_attribute_path: preferred_username
      name_attribute_path: name
      # Same URLs as the browser (CoreDNS rewrite), over TLS signed by the mkcert CA.
      auth_url: https://sso.localtest.me/realms/ops/protocol/openid-connect/auth
      token_url: https://sso.localtest.me/realms/ops/protocol/openid-connect/token
      api_url: https://sso.localtest.me/realms/ops/protocol/openid-connect/userinfo
      tls_client_ca: /etc/ssl/localtest/ca.crt
      # Keycloak groups -> Grafana roles. Strict: a user in none of the groups cannot log in.
      role_attribute_path: "contains(groups[*], 'sre') && 'Admin' || contains(groups[*], 'dev') && 'Editor' || contains(groups[*], 'viewer') && 'Viewer'"
      role_attribute_strict: true
      allow_assign_grafana_admin: false
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
    users:
      allow_sign_up: false
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oauth
        key: client-secret
  # CA of https://*.localtest.me (deploy/scripts/mkcert-ca.sh) for the token and userinfo calls.
  extraConfigmapMounts:
    - name: localtest-ca
      mountPath: /etc/ssl/localtest
      configMap: localtest-ca
      readOnly: true
  # Measured ~250-280 MiB working set (Grafana 13) and ~75 MiB per sidecar.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    datasources:
      url: http://kps-prometheus.observability.svc:9090/
      # Metric -> trace: exemplars carry the trace_id label (OTel SDK -> OTLP -> Prometheus).
      exemplarTraceIdDestinations:
        datasourceUid: tempo
        traceIdLabelName: trace_id
        urlDisplayLabel: View trace
  # Correlations between the three signals, all provisioned. Grafana expands $VAR in provisioning
  # files, so Grafana's own ${...} and $__ macros are written as $${...} / $$__.
  # https://grafana.com/docs/grafana/latest/datasources/tempo/configure-tempo-data-source/provision/
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.observability.svc:3100
      editable: false
      jsonData:
        maxLines: 1000
        # Log -> trace. trace_id is Loki structured metadata (the Collector maps the JSON field to
        # the log record's trace context), so a "label" matcher is used, not a regex on the line.
        derivedFields:
          - name: TraceID
            matcherType: label
            matcherRegex: trace_id
            datasourceUid: tempo
            url: "$${__value.raw}"
            urlDisplayLabel: View trace
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.observability.svc:3200
      editable: false
      jsonData:
        # Trace -> logs: the span's service.name is Loki's service_name stream label; trace_id is
        # structured metadata, so it is a label filter after the stream selector.
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          tags:
            - key: service.name
              value: service_name
          customQuery: true
          query: '{$${__tags}} | trace_id="$${__trace.traceId}"'
        # Trace -> metrics: RED of the span's service from the OTLP HTTP server histogram.
        tracesToMetrics:
          datasourceUid: prometheus
          spanStartTimeShift: "-15m"
          spanEndTimeShift: "15m"
          tags:
            - key: service.name
              value: service_name
          queries:
            - name: Request rate
              query: 'sum(rate(http_server_request_duration_seconds_count{$$__tags}[$$__rate_interval]))'
            - name: 5xx ratio
              query: 'sum(rate(http_server_request_duration_seconds_count{$$__tags, http_response_status_code=~"5.."}[$$__rate_interval])) / sum(rate(http_server_request_duration_seconds_count{$$__tags}[$$__rate_interval]))'
            - name: p95 latency
              query: 'histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{$$__tags}[$$__rate_interval])))'
        # Service map from Tempo's metrics-generator (traces_service_graph_* in Prometheus).
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true
        lokiSearch:
          datasourceUid: loki
        search:
          hide: false
        traceQuery:
          timeShiftEnabled: true
          spanStartTimeShift: "-30m"
          spanEndTimeShift: "30m"

# --- Exporters ---------------------------------------------------------------------------------
kube-state-metrics:
  fullnameOverride: kube-state-metrics
  # Exposes the pod label app.kubernetes.io/name as kube_pod_labels{label_app_kubernetes_io_name},
  # which the pod alerts use as their `service` label. Only this one label: pod labels are
  # otherwise high-cardinality noise.
  metricLabelsAllowlist:
    - pods=[app.kubernetes.io/name]
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  fullnameOverride: node-exporter
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 64Mi
