# Blackbox exporter (prometheus-community/prometheus-blackbox-exporter): synthetic black-box health.
# Prometheus calls /probe?module=http_2xx&target=<url> for every Probe resource
# (deploy/charts/observability-config/templates/probes.yaml), which requests each service's /readyz
# through its in-cluster Service URL, the same path that order -> user/payment takes.
# probe_success is the basis of the ServiceDown alert (Phase 5).
# Values reference: https://github.com/prometheus-community/helm-charts/blob/main/charts/prometheus-blackbox-exporter/values.yaml
fullnameOverride: blackbox-exporter

config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        # /readyz answers 200 or 503; a redirect would hide a misconfiguration.
        follow_redirects: false
        preferred_ip_protocol: ip4

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi

# The exporter's own metrics (blackbox_exporter_*). Probe targets are defined as Probe resources.
serviceMonitor:
  selfMonitor:
    enabled: true
