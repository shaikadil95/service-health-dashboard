# Payment service: internal only. No HTTPRoute; only order may call it.
image:
  repository: localhost/shd/payment-service

# Only tokens for the payment-service audience with the payments:write client role (order's
# service account).
auth:
  enabled: true
  audiences: [payment-service]

networkPolicy:
  ingressFrom:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: order

httpRoute:
  enabled: false
